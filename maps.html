<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

<style>
    #map { height: 400px; }
    .popup-image {
            max-width: 200px;
            height: auto;
        }
</style>

</head>
<body>
    <h1>Basic Map</h1>
     <div id="map"></div>
</body>
<script>
function initMap(mapDataUrl){

    var map = L.map('map').setView([8.360524433834668, 124.86832294111598], 17); //instance of the map
    //imported tile layer from OpenStreetMap
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
    console.log("Map Loaded " + Date());//log map load time

    fetch(mapDataUrl)//it creates a request to the server and fetches the data
        .then(response => response.json())//parses the response as JSON
        .then(data => {//process the data
            data.forEach(pin=> {//iterate through each location in the data
                const marker = L.marker([pin.lat, pin.lng]).addTo(map);
                const img = `<img src=' + '${pin.img}' + ' class=popup-image>`;//create image element for popup
                const popupContent = `${Img}<br><b> ${pin.title} </b><br> ${pin.description} `;//create popup content

                console.log(`${pin.name} Loaded ` +Date());
        });
    })
    .catch(error => console.error('Error loading JSON:', error));//handle errors
}

document.addEventListener('DOMContentLoaded',()=>{
    initMap('map_data.json');//initialize map with data from map_data.json
})
</script>
</html>
